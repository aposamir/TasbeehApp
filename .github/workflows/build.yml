name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with standard gradle
      run: gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: TasbeehApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
